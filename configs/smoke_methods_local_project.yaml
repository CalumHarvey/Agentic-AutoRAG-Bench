# Project config for the cost-aware, all-methods local smoke test (smoke_methods_local.yaml).
#
# Every model runs through Ollama on a 6 GB GPU:
# - generator qwen2.5:7b on the GPU, with an 8k context so long prompts are not cut;
# - judge gemma3:4b on the CPU only (num_gpu 0), so it stays loaded next to the
#   generator instead of swapping it out of the GPU on every question;
# - optimizer qwen3:8b (agentic methods only, once per trial), swapped onto the GPU.
# Each alias maps a model to itself, so the shadow prices in local_model_prices.json
# still apply.

meta:
  project_name: "smoke-methods-local"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps.
  output_dir: "./experiment-0/smoke_methods_local/.shared_cache"
  max_trials: 3
  cache_max_gb: 5.0
  # Two objectives: accuracy up, per-query LLM cost (generation + query expansion) down.
  cost_aware: true

model_aliases:
  ollama/qwen2.5:7b:
    model: ollama/qwen2.5:7b
    num_ctx: 8192
  ollama/gemma3:4b:
    model: ollama/gemma3:4b
    num_ctx: 4096
    num_gpu: 0
  ollama/qwen3:8b:
    model: ollama/qwen3:8b
    num_ctx: 16384

agent:
  # The exam is fixed (custom_exam_path), so the examiner is never called.
  examiner_model: "ollama/qwen3:8b"
  optimizer_model: "ollama/qwen3:8b"
  judge_model: "ollama/gemma3:4b"
  concurrency: 2

examiner:
  custom_exam_path: ./benchmark_data/multihop_rag_val/smoke_exam_20.json
  exam_size: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  # One chunking strategy and overlap keep index builds to at most 2 per embedder.
  chunking:
    strategies: ["recursive"]
    chunk_token_size: { values: [256, 512] }
    chunk_token_overlap: { values: [0] }

  embedding:
    models:
      - "BAAI/bge-small-en-v1.5"
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "Snowflake/snowflake-arctic-embed-xs"

  retrieval:
    index_types: ["vector_only", "hybrid_bm25_vector"]
    top_k: { min: 3, max: 10 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  query_expansion:
    strategies: ["none"]
    models:
      - "ollama/qwen2.5:7b"

  reranker:
    models:
      - "none"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "mixedbread-ai/mxbai-rerank-xsmall-v1"
    top_n: { min: 3, max: 10 }

  generator:
    models:
      - "ollama/qwen2.5:7b"
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
