# Smoke-trial project config with a local generator: smoke_multihop_project.yaml with
# qwen2.5:7b (Ollama) as the generator. Judge, examiner and optimizer stay on Gemini.
#
# Ollama's default 4k context would cut off long prompts (top_k 10 x 512-token chunks is
# over 5k tokens), so the alias below sends num_ctx 8192 with every call. The alias maps
# the model to itself, so the shadow price in local_model_prices.json still applies.

meta:
  project_name: "smoke-multihop-local"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps.
  output_dir: "./experiment-0/smoke_multihop_local/.shared_cache"
  max_trials: 3
  cache_max_gb: 5.0
  cost_aware: false

model_aliases:
  ollama/qwen2.5:7b:
    model: ollama/qwen2.5:7b
    num_ctx: 8192

agent:
  # Random search calls neither the examiner nor the optimizer; they only have to validate.
  examiner_model: "gemini/gemini-3.5-flash-lite"
  optimizer_model: "gemini/gemini-3.5-flash-lite"
  judge_model: "gemini/gemini-3.5-flash-lite"
  # Free tier has a per-minute limit as well as a daily one; Ollama queues the rest.
  concurrency: 2

examiner:
  custom_exam_path: ./benchmark_data/multihop_rag_val/smoke_exam_20.json
  exam_size: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { values: [256, 512] }
    chunk_token_overlap: { values: [0, 64] }

  embedding:
    models:
      - "BAAI/bge-small-en-v1.5"

  retrieval:
    index_types: ["vector_only", "hybrid_bm25_vector"]
    top_k: { min: 3, max: 10 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  query_expansion:
    strategies: ["none"]
    models:
      - "gemini/gemini-3.5-flash-lite"

  reranker:
    models:
      - "none"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: { min: 3, max: 10 }

  generator:
    models:
      - "ollama/qwen2.5:7b"
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
