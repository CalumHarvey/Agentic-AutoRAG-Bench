# Smoke-trial project config: measures what one live trial costs on free Gemini.
#
# Same corpus and exam source as multihop_rag_paper_project.yaml, cut down so a run
# fits the free tier (about 500 requests a day): a 20-question stratified slice of the
# validation exam (11 inference, 7 comparison, 2 null, seed 42), one small embedder,
# no query expansion, and gemini-3.5-flash-lite as generator and judge.

meta:
  project_name: "smoke-multihop"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps.
  output_dir: "./experiment-0/smoke_multihop/.shared_cache"
  max_trials: 3
  cache_max_gb: 5.0
  cost_aware: false

agent:
  # Random search calls neither the examiner nor the optimizer; they only have to validate.
  examiner_model: "gemini/gemini-3.5-flash-lite"
  optimizer_model: "gemini/gemini-3.5-flash-lite"
  judge_model: "gemini/gemini-3.5-flash-lite"
  # Free tier has a per-minute limit as well as a daily one.
  concurrency: 2

examiner:
  custom_exam_path: ./benchmark_data/multihop_rag_val/smoke_exam_20.json
  exam_size: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { values: [256, 512] }
    chunk_token_overlap: { values: [0, 64] }

  embedding:
    models:
      - "BAAI/bge-small-en-v1.5"

  retrieval:
    index_types: ["vector_only", "hybrid_bm25_vector"]
    top_k: { min: 3, max: 10 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  query_expansion:
    strategies: ["none"]
    models:
      - "gemini/gemini-3.5-flash-lite"

  reranker:
    models:
      - "none"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: { min: 3, max: 10 }

  generator:
    models:
      - "gemini/gemini-3.5-flash-lite"
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
